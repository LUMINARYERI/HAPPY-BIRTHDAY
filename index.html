 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }
    .birthday-card {
      text-align: center;
      max-width: 400px;
      margin: 20px;
      padding: 30px;
      background-color: #ffffff;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      z-index: 10;
      position: relative;
    }
    /* Friend Photo Styling */
    .friend-photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ff4757;
      margin: 0 auto 15px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: block;
    }
    h1 {
      color: #ff4757;
      margin-bottom: 10px;
      font-size: 26px;
    }
    p {
      color: #555;
      font-size: 16px;
      line-height: 1.5;
    }
    .signature {
      margin-top: 20px;
      margin-bottom: 25px;
      font-weight: bold;
      color: #2ed573;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .btn {
      background-color: #ff4757;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.1s, background 0.2s;
      width: 80%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn:hover {
      background-color: #e84118;
      transform: scale(1.03);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .secondary-btn {
      background-color: #341f97;
    }
    .secondary-btn:hover {
      background-color: #5f27cd;
    }
    #secretMessage {
      display: none;
      margin-top: 15px;
      padding: 10px;
      background: #f1f2f6;
      border-left: 4px solid #ff4757;
      border-radius: 4px;
      font-style: italic;
    }
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0.8;
      top: -10px;
      z-index: 1;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { top: -10px; transform: translateX(0) rotate(0deg); }
      100% { top: 100vh; transform: translateX(100px) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="confetti-wrapper"></div>

  <div class="birthday-card">
    <!-- 📸 CHANGE IMAGE LINK HERE -->
    <img class="friend-photo" src="https://unsplash.com" alt="Friend's Photo">

    <!-- ✍️ EDIT TEXT BELOW -->
    <h1>🎉 Happy Birthday, BELL! 🎂</h1>
    <p>Wishing you an amazing day filled with great food, good laughs, and all your favorite things.</p>
    <p>Here is to another fantastic year ahead,I LOB U!</p>
    <div class="signature">– From ERI</div>

    <div class="btn-container">
      <button class="btn" id="musicBtn" onclick="toggleMusic()">🎵 Play Birthday Music</button>
      <button class="btn secondary-btn" onclick="revealMessage()">🎁 Open Surprise Gift</button>
    </div>

    <div id="secretMessage">
      I am so incredibly lucky to have you as a friend. Cheers to celebrating you today! 🥳✨
    </div>

    <audio id="birthdayAudio" loop>
      <source src="https://soundhelix.com" type="audio/mpeg">
    </audio>
  </div>

  <script>
    const audio = document.getElementById('birthdayAudio');
    const musicBtn = document.getElementById('musicBtn');

    function toggleMusic() {
      if (audio.paused) {
        audio.play();
        musicBtn.innerText = "⏸️ Pause Music";
      } else {
        audio.pause();
        musicBtn.innerText = "🎵 Play Birthday Music";
      }
    }

    function revealMessage() {
      const message = document.getElementById('secretMessage');
      message.style.display = message.style.display === "block" ? "none" : "block";
    }

    const wrapper = document.getElementById('confetti-wrapper');
    const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#eccc68', '#ff6b81', '#70a1ff'];

    for (let i = 0; i < 100; i++) {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
      confetti.style.animationDelay = (Math.random() * 5) + 's';
      confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
      confetti.style.width = Math.random() * 8 + 6 + 'px';
      confetti.style.height = Math.random() * 12 + 6 + 'px';
      wrapper.appendChild(confetti);
    }
  </script>

</body>
</html>
